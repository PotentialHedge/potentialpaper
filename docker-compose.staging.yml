# Staging, https://staging.potentialpaper.com: the production file with this one over it, as its own compose project
# behind a password. DEPLOY.md, "Staging", is the recipe.
#
#   dcs() { docker compose -p potentialpaper-staging -f docker-compose.prod.yml -f docker-compose.staging.yml \
#             --env-file .env.staging "$@"; }
#
# .env.staging sets COMPOSE_PROJECT_NAME=potentialpaper-staging (the routers' names), APP_HOST and APP_URL, its own
# BETTER_AUTH_SECRET and Postgres password, and CONTENT_HOST_PATTERN to a host that never matches: production
# answers the user content domain, and two routers with one rule would split its traffic. STAGING_BASIC_AUTH is the
# htpasswd line, with every `$` doubled.

services:
  app:
    # Images of their own: production's tools image has no tag, and a staging build must never replace it.
    image: potentialpaper-staging-app:${GIT_COMMIT:-latest}
    env_file: .env.staging
    labels:
      - traefik.http.routers.${COMPOSE_PROJECT_NAME}.middlewares=${COMPOSE_PROJECT_NAME}-auth,${COMPOSE_PROJECT_NAME}-headers,${COMPOSE_PROJECT_NAME}-ratelimit,${COMPOSE_PROJECT_NAME}-compress
      - traefik.http.routers.${COMPOSE_PROJECT_NAME}-git.middlewares=${COMPOSE_PROJECT_NAME}-auth,${COMPOSE_PROJECT_NAME}-git-ratelimit
      - traefik.http.middlewares.${COMPOSE_PROJECT_NAME}-auth.basicauth.users=${STAGING_BASIC_AUTH}
      - traefik.http.middlewares.${COMPOSE_PROJECT_NAME}-auth.basicauth.realm=potentialpaper staging
      - traefik.http.middlewares.${COMPOSE_PROJECT_NAME}-auth.basicauth.removeheader=true
      - traefik.http.middlewares.${COMPOSE_PROJECT_NAME}-headers.headers.customresponseheaders.X-Robots-Tag=noindex, nofollow

  tools:
    image: potentialpaper-staging-tools
    env_file: .env.staging

  ingest:
    image: potentialpaper-staging-tools
    env_file: .env.staging

  worker:
    image: potentialpaper-staging-tools
    env_file: .env.staging

  ssh:
    image: potentialpaper-staging-tools
    env_file: .env.staging
