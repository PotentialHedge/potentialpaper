# Runs behind the host's shared Traefik, which owns :80/:443 and admits only Cloudflare. This file
# publishes no ports: `app` joins the external `web` network and is routed by its labels alone.
# APP_HOST in .env.production names the host, so one file serves staging and production: use a
# different project name (`-p potentialpaper-staging`) and env file for each.
#
# Deploy: DEPLOY.md is the full recipe.
# Commit first: the image is tagged with HEAD's commit.
#   test -z "$(git status --porcelain)" && export GIT_COMMIT=$(git rev-parse --short HEAD)
#   docker compose -f docker-compose.prod.yml --env-file .env.production --profile tools build
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d postgres
#   docker compose -f docker-compose.prod.yml --env-file .env.production run --rm tools
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d app
#   docker compose -f docker-compose.prod.yml --env-file .env.production --profile tools up -d ingest worker ssh
#   scripts/purge-edge-cache.sh
#
# The purge is required: cached pages name the old build's scripts, which the new container no longer has.
#
# Migrations are their own step, never run at app start. `build` needs --profile tools: without it
# the tools image goes stale and migrate silently applies nothing new.

name: potentialpaper

x-logging: &logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '5'

services:
  postgres:
    image: postgres:19.0
    restart: unless-stopped
    logging: *logging
    command: ['postgres', '-c', 'autovacuum_max_parallel_workers=2']
    # Docker's default /dev/shm is 64 MB; parallel queries over signal_values ran out of it ("could not resize
    # shared memory segment ... No space left on device").
    shm_size: 1g
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      # Since 18 the image keeps data in /var/lib/postgresql/<major>/docker, so the volume mounts one level up.
      - pgdata19:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 30s
      timeout: 5s
      retries: 20

  app:
    build:
      context: .
      target: app
      args:
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
        # Pages prerendered at build name absolute URLs (link previews, `metadataBase`), so the build needs the origin.
        APP_URL: ${APP_URL:-}
    image: potentialpaper-app:${GIT_COMMIT:-latest}
    restart: unless-stopped
    logging: *logging
    env_file: .env.production
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - default
      - web
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    labels:
      - traefik.enable=true
      - traefik.docker.network=web
      - traefik.http.routers.${COMPOSE_PROJECT_NAME:-potentialpaper}.rule=Host(`${APP_HOST}`)
      - traefik.http.routers.${COMPOSE_PROJECT_NAME:-potentialpaper}.entrypoints=websecure
      - traefik.http.routers.${COMPOSE_PROJECT_NAME:-potentialpaper}.tls=true
      - traefik.http.routers.${COMPOSE_PROJECT_NAME:-potentialpaper}.middlewares=${COMPOSE_PROJECT_NAME:-potentialpaper}-ratelimit,${COMPOSE_PROJECT_NAME:-potentialpaper}-compress
      - traefik.http.services.${COMPOSE_PROJECT_NAME:-potentialpaper}.loadbalancer.server.port=3000
      # A dumb-HTTP clone asks for each git object separately: over a thousand quick requests for a page with
      # a few hundred edits, all small primary-key reads. It would trip the limit below, and git gives up on a 429.
      - traefik.http.routers.${COMPOSE_PROJECT_NAME:-potentialpaper}-git.rule=Host(`${APP_HOST}`) && PathPrefix(`/git/`)
      - traefik.http.routers.${COMPOSE_PROJECT_NAME:-potentialpaper}-git.entrypoints=websecure
      - traefik.http.routers.${COMPOSE_PROJECT_NAME:-potentialpaper}-git.tls=true
      - traefik.http.routers.${COMPOSE_PROJECT_NAME:-potentialpaper}-git.service=${COMPOSE_PROJECT_NAME:-potentialpaper}
      - traefik.http.routers.${COMPOSE_PROJECT_NAME:-potentialpaper}-git.middlewares=${COMPOSE_PROJECT_NAME:-potentialpaper}-git-ratelimit
      - traefik.http.middlewares.${COMPOSE_PROJECT_NAME:-potentialpaper}-git-ratelimit.ratelimit.average=${GIT_RATE_LIMIT_AVERAGE:-200}
      - traefik.http.middlewares.${COMPOSE_PROJECT_NAME:-potentialpaper}-git-ratelimit.ratelimit.burst=${GIT_RATE_LIMIT_BURST:-1500}
      - traefik.http.middlewares.${COMPOSE_PROJECT_NAME:-potentialpaper}-git-ratelimit.ratelimit.period=1s
      - traefik.http.middlewares.${COMPOSE_PROJECT_NAME:-potentialpaper}-git-ratelimit.ratelimit.sourcecriterion.requestheadername=Cf-Connecting-Ip
      # User content on a domain of its own (lib/demos.ts): demos (sandboxed code from GitHub) at <snapshot>.<domain>
      # and the web editor's webviews at <uuid>.<domain>. A first visit asks for every file of a demo at once, so it
      # gets the git router's limit. The app answers these hosts from proxy.ts, and nothing else of the app.
      - traefik.http.routers.${COMPOSE_PROJECT_NAME:-potentialpaper}-demos.rule=HostRegexp(`^([a-z0-9-]+\.)?${CONTENT_HOST_PATTERN:-ppusercontent\.com}$$`)
      - traefik.http.routers.${COMPOSE_PROJECT_NAME:-potentialpaper}-demos.entrypoints=websecure
      - traefik.http.routers.${COMPOSE_PROJECT_NAME:-potentialpaper}-demos.tls=true
      - traefik.http.routers.${COMPOSE_PROJECT_NAME:-potentialpaper}-demos.service=${COMPOSE_PROJECT_NAME:-potentialpaper}
      - traefik.http.routers.${COMPOSE_PROJECT_NAME:-potentialpaper}-demos.middlewares=${COMPOSE_PROJECT_NAME:-potentialpaper}-git-ratelimit,${COMPOSE_PROJECT_NAME:-potentialpaper}-compress
      # Compression for the app and user content (Next's own is off: next.config.ts): zstd, br or gzip, whichever the
      # client (Cloudflare) takes first, streamed responses included. Not on /git/: its objects are compressed already.
      - traefik.http.middlewares.${COMPOSE_PROJECT_NAME:-potentialpaper}-compress.compress.encodings=zstd,br,gzip
      - traefik.http.middlewares.${COMPOSE_PROJECT_NAME:-potentialpaper}-compress.compress.excludedcontenttypes=image/png,image/jpeg,image/webp,image/avif,image/gif,application/pdf,application/zip,application/gzip,video/mp4,font/woff2
      # Anonymous traffic is the edge's job, keyed on the real client IP, which is trustworthy
      # because only Cloudflare can reach this origin.
      - traefik.http.middlewares.${COMPOSE_PROJECT_NAME:-potentialpaper}-ratelimit.ratelimit.average=${RATE_LIMIT_AVERAGE:-30}
      - traefik.http.middlewares.${COMPOSE_PROJECT_NAME:-potentialpaper}-ratelimit.ratelimit.burst=${RATE_LIMIT_BURST:-60}
      - traefik.http.middlewares.${COMPOSE_PROJECT_NAME:-potentialpaper}-ratelimit.ratelimit.period=1s
      - traefik.http.middlewares.${COMPOSE_PROJECT_NAME:-potentialpaper}-ratelimit.ratelimit.sourcecriterion.requestheadername=Cf-Connecting-Ip

  tools:
    build:
      context: .
      target: tools
    image: potentialpaper-tools
    profiles: [tools]
    env_file: .env.production
    environment:
      # Scripts that commit ask the app to refresh the page's cached HTML (server/internal.ts).
      APP_INTERNAL_URL: http://app:3000
    depends_on:
      postgres:
        condition: service_healthy

  # The PDF ingest pipeline (src/server/pdfs/ingest.ts): every minute, runs each stage that is missing or
  # out of date on every PDF a page points at, so a new pdf.json is read without anyone running anything.
  # One-off runs: `dc run --rm tools npm run pdfs:ingest -- --help`.
  ingest:
    image: potentialpaper-tools
    profiles: [tools]
    restart: unless-stopped
    logging: *logging
    env_file: .env.production
    command: ['npm', 'run', 'pdfs:ingest', '--', '--watch']
    depends_on:
      postgres:
        condition: service_healthy

  # The outbox consumers (src/server/consumers/, DESIGN.md §4.9): keeps derived data (search, the review
  # tables) up with page_events, woken by each commit's NOTIFY and polling every 15 s. Starting a consumer
  # over: `dc run --rm tools npm run consumers:rebuild -- <name>`.
  worker:
    image: potentialpaper-tools
    profiles: [tools]
    restart: unless-stopped
    logging: *logging
    env_file: .env.production
    command: ['npm', 'run', 'consumers:work']
    stop_signal: SIGTERM
    depends_on:
      postgres:
        condition: service_healthy

  # Git over SSH (src/server/git/ssh.ts): `git clone ssh://git@<GIT_SSH_URL's host>:2222/abs/<id>.git`. Its own
  # process from the tools image, published straight on the host (Cloudflare doesn't proxy SSH, Traefik isn't
  # in the way): DEPLOY.md, "Git over SSH", for the DNS name, the port and the host key. A push asks the app to
  # refresh the paper's pages (APP_INTERNAL_URL), since only the Next process can.
  ssh:
    image: potentialpaper-tools
    profiles: [tools]
    restart: unless-stopped
    logging: *logging
    env_file: .env.production
    environment:
      GIT_SSH_HOST: 0.0.0.0
      GIT_SSH_PORT: 2222
      GIT_SSH_HOST_KEY_FILE: /run/secrets/ssh_host_key
      APP_INTERNAL_URL: http://app:3000
    command: ['npm', 'run', 'git:ssh']
    ports:
      - '${GIT_SSH_PUBLISH:-2222}:2222'
    volumes:
      # The host key, made once on the host and kept: clients remember it and warn if it ever changes. By absolute
      # path (GIT_SSH_HOST_KEY_PATH in .env.production): a deploy from a fresh worktree has no ./secrets, and Docker would
      # mount an empty directory in its place.
      - ${GIT_SSH_HOST_KEY_PATH:-./secrets/ssh_host_ed25519_key}:/run/secrets/ssh_host_key:ro
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  # Postgres 16's data, kept unmounted until it is no longer needed (DEPLOY.md, "Postgres 19").
  pgdata:
  pgdata19:

networks:
  web:
    external: true
