name: CI
on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: potentialpaper
          POSTGRES_PASSWORD: potentialpaper
          POSTGRES_DB: potentialpaper_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U potentialpaper"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://potentialpaper:potentialpaper@127.0.0.1:5432/potentialpaper_test
      TEST_DATABASE_URL: postgres://potentialpaper:potentialpaper@127.0.0.1:5432/potentialpaper_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run db:migrate
      - run: npm run test:all
      - run: npm run build
