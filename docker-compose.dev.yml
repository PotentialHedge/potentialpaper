# Dev database only. `next dev` runs on the host and talks to this over 127.0.0.1:55433.
# 5432 and 6543 are taken by unrelated containers on the dev host, and 55432 is acceptodds'.
name: papertrail-dev

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: papertrail
      POSTGRES_PASSWORD: papertrail
      POSTGRES_DB: papertrail
    ports:
      - '127.0.0.1:55433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U papertrail -d papertrail']
      interval: 30s
      timeout: 5s
      retries: 20
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '5'

volumes:
  pgdata:
