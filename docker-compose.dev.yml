# Dev database only. `next dev` runs on the host and talks to this over 127.0.0.1:55433.
# 5432 and 6543 are taken by unrelated containers on the dev host, and 55432 is acceptodds'.
name: potentialpaper-dev

services:
  postgres:
    # Postgres 19 (handoffs/data-model.md Phase 0). Since 18 the image keeps data under
    # /var/lib/postgresql/<major>/docker, so the volume mounts /var/lib/postgresql: mounting the old
    # .../data path would leave the real data inside the container. `pgdata` is the old 16 volume, kept
    # until 19 checks out.
    image: postgres:19rc2
    restart: unless-stopped
    environment:
      POSTGRES_USER: potentialpaper
      POSTGRES_PASSWORD: potentialpaper
      POSTGRES_DB: potentialpaper
    command: ['postgres', '-c', 'autovacuum_max_parallel_workers=2']
    ports:
      - '127.0.0.1:55433:5432'
    volumes:
      - pgdata19:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U potentialpaper -d potentialpaper']
      interval: 30s
      timeout: 5s
      retries: 20
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '5'

volumes:
  pgdata19:
